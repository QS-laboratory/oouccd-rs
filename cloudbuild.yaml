steps:
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args: ['-c', 'docker pull gcr.io/$PROJECT_ID/oouccd-rs:latest || exit 0']
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-t', 'gcr.io/$PROJECT_ID/oouccd-rs:latest',
      '-t', 'gcr.io/$PROJECT_ID/oouccd-rs:$SHORT_SHA',
      '--cache-from', 'gcr.io/$PROJECT_ID/oouccd-rs:latest',
      '.'
    ]
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/oouccd-rs:latest']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/oouccd-rs:$SHORT_SHA']
