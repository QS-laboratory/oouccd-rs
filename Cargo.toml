[package]
name = "oouccd-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
aberth = "0.4.1"
anyhow = "1.0.102"
argmin = "0.11.0"
argmin-math = { version = "0.5.1", features = ["vec", "ndarray_latest"] }
clap = { version = "4.6.0", features = ["derive", "env"] }
nalgebra = "0.34.2"
ndarray = { version = "0.15", features = ["serde"] }
ndarray-npy = "0.8.1"
num-complex = "0.4.6"
pyo3 = { version = "0.20", features = ["auto-initialize"] }
qoqo_calculator = "1.7.1"
rand = "0.8.5"
rand_distr = "0.4.3"
rayon = "1.11.0"
roots = "0.0.8"
roqoqo = "1.21.0"
roqoqo-quest = "0.18.1"
roqoqo-qasm = "0.15"
rusqlite = { version = "0.39.0", features = ["bundled"] }
rustfft = "6.4.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "^2.9", features = ["json"] }
urlencoding = "2.1.3"

[dev-dependencies]
roqollage = "0.9.1"
